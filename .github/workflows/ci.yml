name: build

on:
  push:
    branches: [prod]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/sergiuscain/apigateway

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -f ApiGateway/Dockerfile -t ${{ env.IMAGE_NAME }}:latest -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push image
        run: docker push --all-tags ${{ env.IMAGE_NAME }}